[package]
name = "bizbuz"
version = "0.1.0"
description = "BizBuz — create your digital business card and share it"
authors = ["Planet Nine"]
edition = "2021"

[lib]
name = "bizbuz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-share-sheet = { path = "tauri-plugin-share-sheet" }
tauri-plugin-app-group = { path = "tauri-plugin-app-group" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bdo-rs = { path = "../../../allyabase/deployment/bdo/src/client/rust/bdo-rs" }
sessionless = "0.1.1"
hex = "0.4"
